<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Kiến trúc học tập: hệ thống quản lý tài liệu serverless trên AWS</title>
  <desc id="desc">Người dùng truy cập frontend qua CloudFront, đăng nhập bằng Cognito và gọi API Gateway. API Gateway kích hoạt Lambda, Lambda lưu metadata vào DynamoDB và file vào S3. CodePipeline và AWS SAM hỗ trợ triển khai; CloudWatch và X-Ray hỗ trợ quan sát.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f8ff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3657d6"/><stop offset="1" stop-color="#263ea5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#20355e" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#62748e"/></marker>
    <style>
      .title{font:700 34px 'Segoe UI',Arial,sans-serif;fill:#14233b}.sub{font:400 17px 'Segoe UI',Arial,sans-serif;fill:#52637a}.label{font:700 17px 'Segoe UI',Arial,sans-serif;fill:#1b2b45}.small{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#52637a}.micro{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#fff;letter-spacing:.7px}.box{fill:#fff;stroke:#d7e0ef;stroke-width:1.5;rx:18;filter:url(#shadow)}.line{fill:none;stroke:#62748e;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#8293ab;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="900" rx="28" fill="url(#bg)"/>
  <text x="64" y="74" class="title">TỪ Ý TƯỞNG ĐẾN ỨNG DỤNG SERVERLESS</text>
  <text x="64" y="108" class="sub">Ví dụ học tập: hệ thống quản lý tài liệu trên AWS</text>

  <rect x="48" y="148" width="1344" height="454" rx="24" fill="#f9fbff" stroke="#dce5f2" stroke-width="1.5"/>
  <text x="76" y="188" class="micro" fill="#49617f">LUỒNG ỨNG DỤNG</text>

  <rect x="88" y="252" width="210" height="118" class="box"/>
  <circle cx="124" cy="293" r="17" fill="#e9efff"/><path d="M116 294h16M124 286v16" stroke="#3657d6" stroke-width="3" stroke-linecap="round"/>
  <text x="116" y="332" class="label">Người dùng</text><text x="116" y="354" class="small">Trình duyệt / ứng dụng</text>

  <rect x="360" y="224" width="242" height="158" class="box"/>
  <rect x="382" y="246" width="198" height="33" rx="10" fill="url(#blue)"/><text x="402" y="268" class="micro">FRONTEND</text>
  <text x="382" y="314" class="label">CloudFront + Amplify</text><text x="382" y="340" class="small">Giao diện và phân phối nội dung</text><text x="382" y="361" class="small">cho người dùng</text>

  <rect x="360" y="428" width="242" height="108" class="box"/>
  <rect x="382" y="448" width="102" height="27" rx="8" fill="#7651c9"/><text x="396" y="467" class="micro">DANH TÍNH</text>
  <text x="382" y="505" class="label">Amazon Cognito</text><text x="382" y="526" class="small">Đăng nhập và xác thực người dùng</text>

  <rect x="674" y="276" width="204" height="118" class="box"/>
  <rect x="696" y="297" width="136" height="29" rx="8" fill="#c85b20"/><text x="712" y="317" class="micro">API</text>
  <text x="696" y="356" class="label">API Gateway</text><text x="696" y="378" class="small">Điểm vào cho yêu cầu</text>

  <rect x="950" y="276" width="192" height="118" class="box"/>
  <rect x="972" y="297" width="136" height="29" rx="8" fill="#d47a12"/><text x="987" y="317" class="micro">LOGIC</text>
  <text x="972" y="356" class="label">AWS Lambda</text><text x="972" y="378" class="small">Xử lý nghiệp vụ tài liệu</text>

  <rect x="1206" y="212" width="158" height="120" class="box"/>
  <rect x="1228" y="233" width="112" height="28" rx="8" fill="#3f7d64"/><text x="1245" y="252" class="micro">METADATA</text>
  <text x="1228" y="290" class="label">DynamoDB</text><text x="1228" y="313" class="small">Tên, chủ sở hữu,</text><text x="1228" y="330" class="small">trạng thái file</text>

  <rect x="1206" y="386" width="158" height="120" class="box"/>
  <rect x="1228" y="407" width="112" height="28" rx="8" fill="#3174a5"/><text x="1249" y="426" class="micro">OBJECT</text>
  <text x="1228" y="464" class="label">Amazon S3</text><text x="1228" y="487" class="small">Nội dung tài liệu</text>

  <path d="M298 310H352" class="line"/><path d="M602 310H666" class="line"/><path d="M878 335H942" class="line"/>
  <path d="M1142 315H1198" class="line"/><path d="M1142 354C1174 354 1170 446 1198 446" class="line"/>
  <path d="M481 382V420" class="dash"/><text x="496" y="410" class="small">xác thực</text>
  <path d="M361 461C322 461 325 350 298 350" class="dash"/>

  <rect x="48" y="630" width="1344" height="176" rx="24" fill="#fff" stroke="#dce5f2" stroke-width="1.5"/>
  <text x="76" y="672" class="micro" fill="#49617f">CÁC NĂNG LỰC ĐI CÙNG VÒNG ĐỜI ỨNG DỤNG</text>
  <rect x="88" y="700" width="368" height="74" rx="15" fill="#f1f5ff" stroke="#d8e2f6"/>
  <text x="112" y="731" class="label">Triển khai có thể lặp lại</text><text x="112" y="754" class="small">AWS SAM + CodePipeline</text>
  <rect x="536" y="700" width="368" height="74" rx="15" fill="#f1f5ff" stroke="#d8e2f6"/>
  <text x="560" y="731" class="label">Quan sát và truy vết</text><text x="560" y="754" class="small">CloudWatch + AWS X-Ray</text>
  <rect x="984" y="700" width="368" height="74" rx="15" fill="#f1f5ff" stroke="#d8e2f6"/>
  <text x="1008" y="731" class="label">Cải tiến theo yêu cầu</text><text x="1008" y="754" class="small">Tìm kiếm · bảo mật · chi phí · độ tin cậy</text>
  <text x="64" y="855" class="small">Sơ đồ khái quát cho mục đích học tập. Cấu hình thực tế cần điều chỉnh theo yêu cầu và rủi ro của workload.</text>
</svg>
