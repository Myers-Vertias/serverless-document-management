<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="870" viewBox="0 0 1440 870" role="img" aria-labelledby="title desc">
  <title id="title">Luồng tải file trực tiếp lên S3 bằng presigned URL</title>
  <desc id="desc">Trình duyệt yêu cầu backend cấp URL. API Gateway chuyển đến Lambda để xác thực và tạo presigned PUT URL. Trình duyệt tải file trực tiếp vào bucket S3 private. S3 gửi sự kiện đến SQS, Lambda xử lý file và ghi trạng thái vào DynamoDB.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f8ff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#20355e" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64758e"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3567c8"/></marker>
    <style>
      .title{font:700 32px 'Segoe UI',Arial,sans-serif;fill:#14233b}.sub{font:400 17px 'Segoe UI',Arial,sans-serif;fill:#52637a}.label{font:700 17px 'Segoe UI',Arial,sans-serif;fill:#1b2b45}.small{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#52637a}.mini{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#fff;letter-spacing:.6px}.box{fill:#fff;stroke:#d7e0ef;stroke-width:1.5;rx:18;filter:url(#shadow)}.line{fill:none;stroke:#64758e;stroke-width:3;marker-end:url(#arrow)}.direct{fill:none;stroke:#3567c8;stroke-width:4;marker-end:url(#arrowBlue)}.dash{fill:none;stroke:#8392a8;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="870" rx="28" fill="url(#bg)"/>
  <text x="64" y="70" class="title">UPLOAD TRỰC TIẾP VÀO AMAZON S3</text>
  <text x="64" y="103" class="sub">Presigned URL cấp quyền cho một request có giới hạn, không chuyển AWS credentials cho trình duyệt</text>

  <rect x="48" y="140" width="1344" height="420" rx="24" fill="#f9fbff" stroke="#dce5f2" stroke-width="1.5"/>
  <text x="76" y="180" class="mini" fill="#49617f">CẤP URL VÀ GỬI FILE</text>

  <rect x="82" y="260" width="208" height="130" class="box"/>
  <circle cx="120" cy="300" r="17" fill="#e9efff"/><path d="M112 301h16M120 293v16" stroke="#3567c8" stroke-width="3" stroke-linecap="round"/>
  <text x="108" y="340" class="label">Trình duyệt</text><text x="108" y="364" class="small">Người dùng đã đăng nhập</text>

  <rect x="372" y="260" width="190" height="130" class="box"/>
  <rect x="394" y="282" width="145" height="28" rx="8" fill="#c85b20"/><text x="408" y="301" class="mini">API</text>
  <text x="394" y="340" class="label">API Gateway</text><text x="394" y="364" class="small">Yêu cầu cấp quyền upload</text>

  <rect x="644" y="238" width="242" height="174" class="box"/>
  <rect x="666" y="260" width="198" height="29" rx="8" fill="#d47a12"/><text x="681" y="280" class="mini">AUTH + SIGN</text>
  <text x="666" y="324" class="label">AWS Lambda</text><text x="666" y="349" class="small">Xác thực và kiểm tra quyền</text><text x="666" y="372" class="small">Tạo key + presigned PUT URL</text><text x="666" y="395" class="small">thời hạn ngắn, quyền tối thiểu</text>

  <rect x="1040" y="238" width="260" height="174" class="box"/>
  <rect x="1062" y="260" width="216" height="29" rx="8" fill="#3174a5"/><text x="1078" y="280" class="mini">BUCKET PRIVATE</text>
  <text x="1062" y="324" class="label">Amazon S3</text><text x="1062" y="349" class="small">Object được ghi vào key đã ký</text><text x="1062" y="372" class="small">Ví dụ: incoming/user-id/uuid</text><text x="1062" y="395" class="small">PUT trực tiếp từ trình duyệt</text>

  <path d="M290 325H364" class="line"/><text x="300" y="307" class="small">1. yêu cầu URL</text>
  <path d="M562 325H636" class="line"/><text x="570" y="307" class="small">2. API call</text>
  <path d="M644 426C590 465 420 465 290 375" class="dash"/><text x="385" y="462" class="small">3. trả presigned URL</text>
  <path d="M290 285C500 175 870 175 1032 285" class="direct"/><text x="530" y="208" class="label" fill="#3567c8">4. PUT file trực tiếp lên S3</text>

  <rect x="48" y="590" width="1344" height="218" rx="24" fill="#fff" stroke="#dce5f2" stroke-width="1.5"/>
  <text x="76" y="632" class="mini" fill="#49617f">XỬ LÝ SAU KHI UPLOAD</text>

  <rect x="164" y="674" width="272" height="92" rx="16" fill="#f1f5ff" stroke="#d8e2f6"/>
  <text x="190" y="711" class="label">S3 Event Notification</text><text x="190" y="739" class="small">ObjectCreated → at-least-once</text>
  <rect x="576" y="674" width="230" height="92" rx="16" fill="#f1f5ff" stroke="#d8e2f6"/>
  <text x="604" y="711" class="label">Amazon SQS</text><text x="604" y="739" class="small">Đệm sự kiện xử lý nền</text>
  <rect x="946" y="674" width="250" height="92" rx="16" fill="#f1f5ff" stroke="#d8e2f6"/>
  <text x="974" y="711" class="label">Lambda worker</text><text x="974" y="739" class="small">Kiểm tra file, cập nhật trạng thái</text>
  <path d="M436 720H568" class="line"/><path d="M806 720H938" class="line"/>
  <rect x="1220" y="683" width="134" height="74" rx="14" fill="#eaf5ef" stroke="#c9e5d4"/>
  <text x="1242" y="714" class="label">DynamoDB</text><text x="1238" y="738" class="small">PENDING / READY</text>
  <path d="M1196 720H1212" class="line"/>
  <text x="64" y="846" class="small">CORS chỉ cho phép trình duyệt gọi đúng origin/method/header; backend vẫn phải kiểm tra quyền. Worker cần chịu được event trùng.</text>
</svg>
